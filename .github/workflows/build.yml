name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: macos-latest # Apple Silicon; nsz não tem binário para Mac Intel
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Eden Mod Manager ${{ github.ref_name }}
          generateReleaseNotes: true
          args: --config src-tauri/tauri.updater.conf.json --bundles ${{ matrix.bundles }}
      - name: Windows portátil (exe + arquivo "portable")
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory "portable-EdenModManager" | Out-Null
          Copy-Item src-tauri/target/release/eden-mod-manager.exe "portable-EdenModManager/EdenModManager.exe"
          New-Item "portable-EdenModManager/portable" -ItemType File | Out-Null
          Compress-Archive "portable-EdenModManager/*" "EdenModManager-portable.zip"
          npx tauri signer sign -k "$env:TAURI_SIGNING_PRIVATE_KEY" -p "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "EdenModManager-portable.zip"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: eden-mod-manager-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/*/*
            EdenModManager-portable.zip
            EdenModManager-portable.zip.sig

          if-no-files-found: ignore
      - name: Anexar portátil à Release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EdenModManager-portable.zip
            EdenModManager-portable.zip.sig
